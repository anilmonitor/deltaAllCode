<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-flow</title>
    <style>
        .container {
            border: 1px solid green;
            display: flex;
            flex-flow: wrap row;
        }

        .box {
            background-color: saddlebrown;
            border: 2px solid white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">Dabbaaa-1</div>
        <div class="box">Dabbaaa-2</div>
        <div class="box">Dabbaaa-3</div>
        <div class="box">Dabbaaa-4</div>
    </div>
</body>

</html>
