<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity concept</title>
    <style>
        #fist{
            color: red;
            background-color: black;
            height: 50vh;
            width: 30vw;
            border: 1px solid darkblue;
            opacity: 0;
            
            /* nothing is visible due to opacity 0 */
        }

        #last{
            color: yellow;
            background-color: chocolate;
            height: 50vh;
            width: 30vw;
            border: 1px solid darkblue;
            opacity: 1; 
        }
    </style>
</head>
<body>
   
    <div id="fist">This is Anil and Love him</div>
    <div id="last">
        <h1>This is RRRR</h1>
    </div>
</body>
</html>
