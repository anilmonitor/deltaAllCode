<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use of !important in css</title>
    <style>
        h1 {
            color: red !important;
            background: yellow !important;
        }

        #h1 {
            color: blue;
            background: #000;
        }
    </style>
</head>

<body>
    <h1 id="h1">Hello world, This is Anil and I love code</h1>
</body>

</html>
