<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo class:Hover</title>
    <style>
        #anil {
            color: blueviolet;
            background: #18b607;
        }

        #anil:hover {
            color: aqua;
            background: #000;
        }

        h2:hover {
            background: yellow;
            color: #000;
            text-transform: uppercase;
            font-weight: 400;
            font-size: xx-large;
        }

        /*botton me hover+click appply k bad*/
        button{
            color: blue;
            background: hotpink;
        }
        button:hover{
            color: yellow;
            background: #000;
        }
        button:active{
            color: green;
            background: red;
            height: 100px;
            width: 100px;
        }
    </style>
</head>

<body>

    <h1 id="anil">Hover here to get change</h1>
    <h2>This is Ritu Kumari &hearts;</h2> <br><br>

    <p>Hover and click on this button to apply hover Pseudo(style) and active Pseudo (style)&#8595;&#8595;&#8595;</p>
    &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<button>Click me!!</button>
</body>

</html>
