<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active pseudo class</title>
    <style>
        button:active{
background: yellow;
font-weight: bolder;
margin-left: 50px;

        }
h1:active{
    color: hotpink;
    background-color: green;
}

.bu1:active{
    color: red;
    background-color: black;
}
        
    </style>
</head>

<body>
    <p>Click on button to apply "active pseudo class"</p>
    <button> Login</button> <br> <br>

    <button>Follow IG</button>
    <h1>This is Anil boy</h1>

    <div>
        Lorem ipsum dolor sit <button class="bu1">This is lorem</button>amet consectetur adipisicing elit. Temporibus, natus.
    </div>
</body>

</html>
