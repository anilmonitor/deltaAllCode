<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texr-shadown use(Self practice)</title>
    <style>
        div {
            border: 1px solid red;
            border-radius: 5px;
            font-weight: bolder;
            font-size: xx-large;
            text-align: center;
            margin: 100px;
            width: 200px;
            height: 50px;
            color: rgb(240, 232, 232);
        }

        /* single color = text-shadow */
        #b1 {
            text-shadow: 0px 0px 5px green;
        }

        /* multiple text shadow color */
        #b2 {
            text-shadow: 2px 0px 10px rgb(46, 9, 214), 7px 10px 7px green;
        }

        .texxt{
            text-shadow: 0px 0px 1px black;
            color: white;
            box-shadow: 0px 0px 10px green;
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <div id="b1">Text shadow 1</div>
    <div id="b2">Text shadow 2</div>

    <section class="texxt">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Tenetur, inventore!</section>
</body>

</html>
