<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display:inline-block; concept</title>
    <style>
       * {
            margin: 0px;
            padding: 0px;
        }

        div{
            border: 2px solid black;
            background-color: rgba(85, 0, 255, 0.68);
            height: 200px;
            width: 200px;
            margin: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div></div>
    <div></div> <br>
    <div></div>
    <div></div>
</body>
</html>
