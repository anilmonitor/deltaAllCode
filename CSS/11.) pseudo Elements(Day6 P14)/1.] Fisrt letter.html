<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Element (First-letter Concept)</title>
    <style>
h1::first-letter{
    color: red;
    background: cyan;
    font-size: xx-large;
    text-transform: lowercase;
    font-weight: 100;
}

h2:nth-of-type(2n)::first-letter{
    color: yellow;
    background: #000;
}
    </style>
</head>
<body>
    <h1>Avengers</h1>
    <h1>Anil and Rahul are dost</h1>
    <h1>This is Car</h1>
    <h1>Ritu is Mat</h1> <br><br><br>

    <h2>Rahul</h2>
    <h2>Ajeet</h2>
    <h2>Ritu</h2>
    <h2>Mandip</h2>
    <h2>Ankesh</h2>
    <h2>Anil</h2>
    <h2>Vikram</h2>
    <h2>Neha</h2>
    <h2>Mandira</h2>
    <h2>Mom</h2>
</body>
</html>
