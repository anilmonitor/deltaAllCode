<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use of percentage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #Container {
            border: 2px solid black;
            background-color: brown;
            height: 100px;
            width: 100%;

        }

        #inner {
            border: 1px solid black;
            background-color: darkgreen;
            height: 50%;
            width: 50%;
        }
    </style>
</head>

<body>
    <div id="Container">
        <div id="inner">ANIL</div>
    </div>
</body>

</html>
