<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Properties</title>
    <style>
        .container {
            border: 1px solid green;
            height: 500px;
            display: flex;
            flex-wrap: wrap;
        }

        #box1 {
            order: 5;
        }

        #box3 {
            order: 3;
        }

        #box2 {
            order: 6;
        }

        #box4{
            order: 7;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" id="box1" style="background-color: red;">Box-1</div>
        <div class="box" id="box2" style="background-color: gold;">Box-2</div>
        <div class="box" id="box3" style="background-color: blue;">Box-3</div>
        <div class="box" id="box4" style="background-color: green;">Box-4</div>
    </div>
</body>

</html>
