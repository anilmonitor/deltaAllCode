<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-item = Flex-Grow</title>
    <style>
        .container {
            border: 1px solid red;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            align-items: flex-start;
        }

        
        /* .box {
            flex-grow: 1;
        } */

        #cont1 {
            flex-grow: 0;
        }

        #cont2 {
            flex-grow: 1;
        }

        #cont3 {
            flex-grow: 0;
        }

        #cont4 {
            flex-grow: 3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" id="cont1" style="background-color: aqua;">box-1</div>
        <div class="box" id="cont2" style="background-color: red;">box-2</div>
        <div class="box" id="cont3" style="background-color: darkblue;">box-3</div>
        <div class="box" id="cont4" style="background-color: yellow;">box-4</div>
    </div>
</body>

</html>
