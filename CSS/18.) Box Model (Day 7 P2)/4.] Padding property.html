<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding concept</title>

   <style>
     div{
        border: 3px solid black;
        padding-top: 20px;

    }

    button{
        background-color: yellow;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 5px;
        padding-top: 10px;
        padding-bottom: 10px;
        font-size: xx-large;
        font-weight: bold;
        color: hotpink;
        text-decoration: overline double blue 1px;
    }

    p{
        color: darkblue;
        font-weight: bolder;
        background-color: rgb(254, 5, 34);
        padding: 70px;
        border: 5px blue solid;
        border-top-left-radius: 10px;
        border-bottom-right-radius: 10px;
        font-size: normal;

    }
   </style>
</head>
<body>
    <div>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Suscipit possimus earum saepe assumenda perspiciatis libero voluptate vero tempora recusandae nemo.
    </div> <br><br>

    <button>Click me!!</button>

    <p>Rahul is a bad not boy</p>
</body>
</html>
