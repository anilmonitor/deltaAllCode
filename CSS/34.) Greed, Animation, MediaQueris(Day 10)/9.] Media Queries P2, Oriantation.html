<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .min_max,
      .landscapemode {
        height: 100px;
        width: 300px;
        background-color: black;
        color: wheat;
        margin: 5px;
      }

      @media (min-width: 300px) and (max-width: 650px) {
        .min_max {
          height: 60px;
          background-color: #ff00e1;
          color: #165050;
        }
      }

      /* Media Queries Oriantation */
      @media (orientation: landscape) {
        .landscapemode {
          background-color: darkgreen;
          color: whitesmoke;
          animation: shadow 1s 0s infinite normal;
        }
      }

      @keyframes shadow {
        0% {
          border: 7px dotted #ff00d9;
        }
        50% {
          border: 7px dotted #0004ff;
        }
        75% {
          border: 7px dotted #108a00;
        }
        100% {
          border: 7px dotted #ff2a00;
        }
      }
    </style>
  </head>
  <body>
    <div class="min_max">Min-width:300px and Max-width:650px</div>

    <!-- Media Queries Oriantation -->
    <div class="landscapemode">When Phone landscap mode me ho tab</div>
  </body>
</html>
