<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid-row</title>
    <style>
      .cont2 {
        height: 300px;
        width: 600px;
        background-color: black;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(4, 1fr);
        grid-gap: 10px;
      }

      .item2 {
        background-color: yellow;
        border: 1px solid #f50000;
        text-align: center;
      }

      .one {
        grid-row: 1/3;

        /* OR */

        grid-row-start: 1;
        grid-row-end: 3;

        /* OR */

        grid-row: 1 / span 2;
      }

      /* 2nd div */
      .two {
        grid-column: 1/3;
        grid-row: 1/3;
      }
    </style>
  </head>
  <body>
    <div class="cont2">
      <div class="item2 one">1</div>
      <div class="item2">2</div>
      <div class="item2">3</div>
      <div class="item2">4</div>
      <div class="item2">5</div>
      <div class="item2">6</div>
      <div class="item2">7</div>
      <div class="item2">8</div>
    </div>
    <hr />
    <div class="cont2">
      <div class="item2 two">1</div>
      <div class="item2">2</div>
      <div class="item2">3</div>
      <div class="item2">4</div>
      <div class="item2">5</div>
      <div class="item2">6</div>
      <div class="item2">7</div>
      <div class="item2">8</div>
    </div>
  </body>
</html>
