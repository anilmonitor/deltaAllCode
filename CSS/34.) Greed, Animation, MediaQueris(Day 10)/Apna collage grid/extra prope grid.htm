<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .box {
        height: 80px;
        width: 120px;
        background-color: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .cont {
        height: 500px;
        width: 700px;
        background-color: #ff69b470;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);
        grid-gap: 10px;

        /* extra property  */

        /* justify-items: center;
        align-items: center; */


        place-items: center;
      }

      .b1{
     place-self: end;
      }
    </style>
</head>
<body>
    <div class="cont">
        <div class="box b1">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
      </div>
</body>
</html>
