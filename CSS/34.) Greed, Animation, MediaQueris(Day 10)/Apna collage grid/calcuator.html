<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
  </head>
  <body>
    <div class="cont">
      <div class="topbar">
        <div class="top-left">
          <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
        </div>
        <div class="top-right">
          <i class="fa-solid fa-calculator"></i>
          <i class="fa-solid fa-table-cells-large"></i>
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
      </div>
      <div class="keysection">
        <button>C</button><button>%</button
        ><button><i class="fa-solid fa-xmark"></i></button
        ><button><i class="fa-solid fa-divide"></i></button><button>7</button
        ><button>8</button><button>9</button
        ><button><i class="fa-solid fa-xmark"></i></button><button>4</button
        ><button>5</button><button>6</button
        ><button><i class="fa-solid fa-minus"></i></button><button>1</button
        ><button>2</button><button>3</button
        ><button><i class="fa-solid fa-plus"></i></button><button>00</button
        ><button>0</button><button>.</button
        ><button style="background-color: #ff7300; font-size: 2.5rem">=</button>
      </div>
    </div>
  </body>
</html>
