<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Model</title>
    <style>
      .box {
        /* height: 80px;
        width: 80px; */
        background-color: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .cont {
        height: 500px;
        width: 700px;
        background-color: #ff69b470;
        display: grid;
        /* grid-template-columns: 100px 100px 100px 100px 200px;
        grid-template-rows: 50px 50px 50px 50px 60px; */

        /* grid-template-columns: auto auto auto;
        gap: 10px;
        grid-template-rows: auto auto auto auto auto; */

        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);

        /* row-gap: 10px;
        column-gap: 20px; */

        grid-gap: 10px;
        /* Or */

        grid-gap: 10px 20px;
      }

      .b1 {
        /* grid-column-start: 1;
        grid-column-end: 3; */

        /* grid-column: 1/3; */
        grid-column: 1/span 2;


        grid-row-start: 1;
        grid-row-end: 3;

        /* or */

        grid-row: 1/3;

        /* or  */

        grid-row: 1/ span 3;
      }
    </style>
  </head>
  <body>
    <div class="cont">
      <div class="box b1">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
    </div>
  </body>
</html>
