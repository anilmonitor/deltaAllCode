<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter-Spacing concept</title>
    <style>
        #normal {
            letter-spacing: normal;
        }

        #a10px {
            letter-spacing: 10px;
            background: orange;
        }

        #a25px {
            letter-spacing: 25px;
            background: rgb(253, 253, 253);

        }

        #a4px {
            letter-spacing: 4px;
            background: green;
        }

        body div {
            border: solid;
        }
    </style>
</head>

<body>

    <h1 id="normal">This is Heading of Web page</h1>
    <div>
        <h1 id="a10px">It's letter spacing is 10px</h1>
        <h1 id="a25px">letter spacing is se on 25px</h1>
        <h1 id="a4px">This is 4px letter spacing</h1>
    </div>
</body>

</html>
