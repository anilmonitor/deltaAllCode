<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-transform</title>
    <style>
        p{
            text-transform: uppercase;
        }

        #lowercase{
            text-transform: lowercase;
        }

        #capitalize{
            text-transform: capitalize;
        }

        #none{
            text-transform: none;
        }
    </style>
</head>
<body>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quia, est.</p> <br><br>

    <h1 id="lowercase">my name is anil AND HE CAN DO ANY THINGS IN HIS LIFE BY APPLYING HIS MING</h1> <br><br>

    <h1 id="capitalize">my name is anil AND HE CAN DO aNY tHINGS IN HIS LIFE bY APPLYING hIS mING</h1> <br><br>

    <h1 id="none">my name is anil AND HE CAN DO ANY THINGS IN HIS LIFE BY APPLYING HIS MING</h1>
</body>
</html>
