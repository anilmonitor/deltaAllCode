<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranfrom:rotate (45 deg)</title>
    <style>
        section {
            margin-top: 100px;
        }

        div {
            height: 50px;
            width: 200px;
            margin: 5px;
            /* border: 2px solid black; */
            text-align: center;
        }

        #one {
            background-color: #57375D;
       transform: rotate(30deg);
        }

        #two {
            background-color: #FF3FA4;
            transform: scale(1);
        }

        #three {
            background-color: #FF9B82;
    
        }

        #four {
            background-color: #f7b8b8;
        }

        #five {
            background-color: #f4d8d8;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.374);
        }

        .lastlist{
            background-color: green;
            margin-top: 20px;
            transform: rotate(12deg);
        }
    </style>
</head>

<body>
    <section>
        <div id="one">1</div>
        <div id="two">2</div>
        <div id="three">3</div>
        <div id="four">4</div>
        <div id="five">5</div>
    </section>

    <section class="lastlist">
        <li>Anil </li>
        <li>Rahul</li>
        <li>Pinkey</li>
        <li>NEha is a bad gurl</li>
    </section>
</body>

</html>
