<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition-duration and transition-delay</title>
    <style>
        #d1 {
            color: red;
            background-color: black;
            height: 50vh;
            width: 26vw;
            transition-duration: 2s;
            transition-delay: 1s;
            margin: 0 auto;
            /* margin (0 and auto) will centre the div */
        }

        #d1:hover {
            background-color: yellow;
            color: black;
            border-radius: 50%;
        }

    </style>
</head>

<body>
    <div id="d1">
        <h1>ANIL</h1>
    </div>
</body>

</html>
