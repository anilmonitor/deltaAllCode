        margin-top: 5px;
      }

      .one {
        grid-column: 1;
        grid-row: 12;
       
      }

      /* .two{
        grid-column: 3;

      .three{

      }
    </style>
  </head>

      <div class="box two"></div>

      <div class="box"></div>
