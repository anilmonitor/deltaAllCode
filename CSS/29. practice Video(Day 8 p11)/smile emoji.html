<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .cont {
        height: 18rem;
        width: 18rem;
        border: 0.1px solid black;
        border-radius: 50%;
        background-color: #ffff00;
      }

      .eye {
        height: 2rem;
        background-color: #751313;
        width: 2rem;
      }

      .left {
        position: relative;
        left: 4.5rem;
        top: 5rem;
        border-radius: 50%;
      }

      .right {
        position: relative;
        left: 12rem;
        top: 3rem;
        border-radius: 50%;
      }

      .mouth {
        height: 3rem;
        background-color: #751313;
        width: 6.5rem;
        position: relative;
        top: 7.5rem;
        left: 6rem;
        border-radius: 0px 0px 10px 10px;
      }

   
    </style>
  </head>

  <body>
    <div class="cont">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>

   
  </body>
</html>
