<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDf practice</title>
    <style>

      .container {
        height: 400px;
        /* width: 400px; */
        border: 2px solid blue;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-evenly;
        align-items: center;
        gap: 7px;
      }

      .box {
        height: 100px;
        width: 100px;
        background-color: gray;
        border-radius: 6px;
        font-size: xx-large;
        text-align: center;
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
      <div class="box">E</div>
      <div class="box">F</div>
      <div class="box">G</div>
      <div class="box">H</div>
      <div class="box">I</div>
    </div>
  </body>
</html>
