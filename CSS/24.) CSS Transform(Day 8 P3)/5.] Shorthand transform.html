<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>we can use Rotate, scale, translate, skew together</title>
    <style>
        div {
            border: 5px solid black;
            font-size: xx-large;
            text-align: center;
            margin: 100px;
            width: 200px;
            height: 50px;
            background-color: rgb(156, 241, 156);
        }

        #one{
            transform: rotate(20deg) skew(20deg) scale(1.5, 1.5) translate(200px, 300px);
        }
    </style>
</head>

<body>
    <div id="one">1</div>
    <div id="two">2</div>
    <div id="four">3</div>
</body>

</html>
