<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranfrom:rotate (45 deg)</title>
    <style>
        section {
            margin-top: 100px;
        }

        section div {
            height: 50px;
            width: 200px;
            margin: 5px;
            border: 2px solid rgb(255, 255, 255);
            text-align: center;
            box-shadow: 2px 2px 8px black;
        }


        /* Transform */
        #one {
            background-color: #57375D;
            transform: rotate(30deg);
        }

        #two {
            background-color: #FF3FA4;
            transform: rotate(-30deg)
        }

        #three {
            background-color: #FF9B82;
            transform: rotate(30deg);
        }

        #four {
            background-color: #f7b8b8;
            transform: rotate(-30deg)
        }

        #five {
            background-color: #f3d0d0;
            transform: rotate(30deg);
        }



        #six {
            background-color: green;
            transform: rotate(-120deg);
        }

        #seven {
            background-color: rgb(12, 166, 12);
            transform: rotate(10deg)
        }
        #eight{
            background-color: pink;
            transform: rotate(0.38rad)

        }
    </style>
</head>

<body>
    <section>
        <div id="one">1</div>
        <div id="two">2</div>
        <div id="three">3</div>
        <div id="four">4</div>
        <div id="five">5</div>
        <br><br><br><br>

        <div id="six">6</div>
        <div id="seven">7</div>
        <div id="eight">8</div>
    </section>

</body>

</html>
