<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform:skew(30deg)</title>

    <style>
        div {
            border: 5px solid black;
            font-size: xx-large;
            text-align: center;
            margin: 50px;
            width: 200px;
            height: 50px;
            background-color: red;
        }


        #one {
            transform: skew(30deg);
        }

        #two{
            transform: skew(-30deg);
        }

        #three{
            transform: skew(-120deg);
        }


        #four{
            transform: skewX(60deg);
        }
    </style>

    
</head>

<body>
    <div id="one">1</div>
    <div id="two">2</div>
    <div id="three">3</div>
    <div id="four">4</div>
</body>

</html>
