<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform: translate() use</title>
    <style>
        div {
            height: 50px;
            width: 250px;
            box-shadow: 1px 1px 8px black;
            margin-left: 200px;
            margin-top: 30px;
            text-align: center;
        }

        div:nth-of-type(1n) {
            background-color: orange;
        }

        div:nth-of-type(2n) {
            background-color: green;
        }


/* X ke along 140px and Y ke along 300px */
        #one {
            transform: translate(150px, 300px);
        }


        /* X ke along 300px */
        #two {
            transform: translateX(300px);
        }


        /* Y ke along -200px */
        #three {
            transform: translateY(-200px);
        }

        .im{
            border: 5px solid gray;
            transform: translate(200px, -100px);
        }
    </style>
</head>

<body>
    <div id="centerdiv">This is in center</div>
    <div id="one">1</div>
    <div id="two">2</div>
    <div id="three">3</div>
    <div id="four">4</div>

    <img src="deepak.jpg" height="100px" class="im">
</body>

</html>
