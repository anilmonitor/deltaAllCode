<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>background-image set</title>
    <!-- <link rel="shortcut icon" href="plant.jpg" type="image/x-icon"> -->

    <style>
    .contain {
        height: 350px;
        width: 600px;
        background-color: greenyellow;
        margin: 0 auto;
        background-image: url("plant.jpg");
        background-size: contain;
        transform: skew(20deg);
      }

      button {
        font-weight: 900;
        font-size: xx-large;
        height: 600px;
        width: 400px;
        background-color: greenyellow;
        margin: 10px;
        background-image: url(plant.jpg);
        background-size: cover;
      }

    </style>
  </head>
  <body>
    <div class="contain">My  name is Anil</div>

    <button></button>
  </body>
</html>
