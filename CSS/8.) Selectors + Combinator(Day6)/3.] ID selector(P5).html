<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID selector concept</title>
    <style>
        #head1 {
            color: pink;
            background: #000;
        }

        #main {
            color: black;
            background: pink;
            border: 5px solid;
            border-style: double;
            border-color: blue;
        }
    </style>
</head>

<body>
    <h1 id="head1">This is H1 heading and I am selecting it with ID head1</h1> <br>

    <h1 id="main">This is the Lorem ipsum dolor sit amet.</h1>
</body>

</html>
