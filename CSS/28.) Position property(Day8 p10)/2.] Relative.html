<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position:relative</title>
    <style>
      div {
        height: 100px;
        width: 100px;
        background-color: darkgreen;
        border: 1px solid black;
      }

      .d1 {
        background-color: yellow;
        position: relative;
        top: 200px;
        left: 300px;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>Position Relative</h1>
      <div class="d1">d1 top 200px , left 300px</div>
      <div class="d2">d2</div>
    </section>
  </body>
</html>
