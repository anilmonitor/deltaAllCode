<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College search Pproject</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS",
          sans-serif;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 2rem;
        margin: 3rem;
        width: 70%;
        border-radius: 10px;

        box-shadow: 2px 2px 10px #00000036;
      }

      select {
        border-radius: 5px;
        height: 2.5rem;
        border: none;
        padding-left: 1rem;
      }

      button {
        background-color: #195ccfe8;
        color: white;
        border: none;
        border-radius: 5px;
        height: 2.5rem;
      }

      li:nth-child(even) {
        background-color: #e0e0e0;
        padding: 5px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <select name="" id="subBtn">
        <option selected>Select a country</option>
      </select>

      <button id="subBtn">Submit</button>

      <ol></ol>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="college.js"></script>
  </body>
</html>
