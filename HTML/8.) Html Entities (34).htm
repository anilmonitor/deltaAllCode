<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Entities</title>
</head>
<body>
<!-- Now we are going to print some characters using html entities -->

<h1>5&lt;10</h1>
<h1>100&gt;50</h1>
<h3>I study in &quot;12<sup>th</sup>&quot;</h3>
<h3>This is a pure &hearts; &#9829;	</h3>
<h4>This is &amp; </h4>
<h3>This is a &bigstar;</h3>
<h2>This is &#6479; </h2>
<h2> This is Copyright symbol &copy;</h2>
<h2>&reg;</h2>

<!-- We can also add extra space between two word or sentence using Entities -->
<h3>This is a &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Dog &nbsp;&nbsp;&nbsp; My name is Anil</h3>

We can find more entities from MDN
<div>
    &gt; &nbsp;&nbsp;&nbsp; &lt; &amp; &nbsp; &nbsp;&nbsp;&nbsp;&nbsp; &quot; 
</div>

<a href="https://html.spec.whatwg.org/multipage/named-characters.html#named-character-references">Html Entity</a>
</body>
</html>
